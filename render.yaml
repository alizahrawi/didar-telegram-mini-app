services:
  - type: web
    name: didar-mini-app
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_AUTH
        value: false
      - key: BOT_MODE
        value: webhook
      - key: SQLITE_PATH
        value: /var/data/didar.db
      - key: APP_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
    disk:
      name: didar-data
      mountPath: /var/data
      sizeGB: 1
